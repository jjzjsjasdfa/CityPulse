[project]
name = "citypulse-api"
version = "0.1.0"
description = "Contract-first city happenings API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2",
  "fastapi[standard]>=0.116.0,<1",
  "geoalchemy2>=0.18.0,<1",
  "psycopg[binary]>=3.2.0,<4",
  "pydantic-settings>=2.10.0,<3",
  "sqlmodel>=0.0.24,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1",
  "pytest>=8.4.0,<9",
  "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
